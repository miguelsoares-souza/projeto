<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — ReciclaMais</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <svg class="logo" width="28" height="28" viewBox="0 0 24 24"><path d="M12 2C7 2 3 6 3 11c0 5 4 9 9 9s9-4 9-9C21 6 17 2 12 2z"/></svg>
        <span class="brand-text">ReciclaMais</span>
      </a>
    </div>
  </header>

  <main class="container section">
    <h1>Área Administrativa</h1>
    <p class="lead">Gerenciamento de usuários cadastrados no sistema.</p>

    <form id="formUser" class="form form--narrow">
      <div class="form-field">
        <label for="nome">Nome do usuário</label>
        <input type="text" id="nome" required>
      </div>

      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>

      <button type="submit" class="btn top">Cadastrar</button>
      <button type="button" id="btnLimpar" class="btn btn--ghost top">Limpar Campos</button>
    </form>

    <div class="form form--narrow" style="margin-top:30px">
      <div class="form-field">
        <label for="pesquisa">Pesquisar usuário</label>
        <input type="text" id="pesquisa" placeholder="Digite nome ou e-mail">
      </div>
    </div>

    <button id="btnExcluirTodos" class="btn btn--ghost top">Excluir todos</button>

    <ul id="listaUsuarios" style="margin-top:20px; list-style:none; padding-left:0"></ul>

  </main>

  <script src="admin.js"></script>

</body>
</html>
